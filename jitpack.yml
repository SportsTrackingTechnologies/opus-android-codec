jdk:
  - openjdk17

before_install:
  - git config --global --add safe.directory /build
  - sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

# Do not run the default `assemble` task: it builds Debug ABIs that are not
# part of the published artifact. Publish only the Release AAR required by
# consumers, and place it in JitPack's local Maven repository.
install:
  - ./gradlew :opus-sdk:publishReleasePublicationToMavenLocal --no-daemon --max-workers=1
